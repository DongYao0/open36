spring:
  application:
    name: Open436-Enrollment
  profiles:
    active: dev
  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        enabled: true
        service-name: enrollment-service
        instance-id: ${spring.application.name}:${random.value}
        health-check-path: /actuator/health
        health-check-interval: 10s
        prefer-ip-address: true
        hostname: ${HOSTNAME:localhost}
  datasource:
    url: jdbc:postgresql://localhost:55400/open436
    username: open436
    password: ${DB_PASSWORD:open436}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized

sa-token:
  token-name: token
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false
  auto-renew: true

cors:
  # 注意：逗号分隔的字符串须整体加单引号包裹，否则 Spring 占位符内部的
  # 逗号会被 YAML 解析为列表项，导致解析失败。
  allowed-origins: '${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:8080}'
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  # 包含业务实际请求头：Sa-Token 的 token、kong satoken-auth 注入的 X-User-*
  allowed-headers: 'Authorization,token,Content-Type,X-Requested-With,X-User-Id,X-Username,X-User-Role,X-User-Status,Accept,Origin,Referer,User-Agent'
  allow-credentials: true
  max-age: 3600
