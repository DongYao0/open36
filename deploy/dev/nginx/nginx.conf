# ══════════════════════════════════════════════════════════
#  Open436 前端聚合网关（本地开发）
#  将 3D 首页(Open436-Landing) 与 Vue 主应用(Open436-Frontend)
#  聚合到单一入口 http://localhost:8080
#
#  路由规则：
#    /            -> Open436-Landing (3D 首页, host:5173)
#    /app/        -> Open436-Frontend (Vue 主应用, host:3000)
#    /api/ /algo  -> 透传至 Vue dev server，由其 vite proxy 分发到各后端微服务
# ══════════════════════════════════════════════════════════

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 50m;

  # WebSocket 升级映射：仅当客户端带 Upgrade 头时才升级连接（Vite HMR）
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # 上游 = 宿主机本地 dev server（容器通过 host.docker.internal 访问宿主）
  upstream portfolio_dev { server host.docker.internal:5173; }
  upstream vue_dev       { server host.docker.internal:3000; }

  server {
    listen 80;
    server_name _;

    # 通用代理头
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # /app 不带尾斜杠 -> 308 到 /app/（Vue base 为 /app/）
    location = /app {
      return 308 /app/;
    }

    # Vue 主应用（base: /app/，proxy_pass 不带 URI，原样保留 /app/ 前缀）
    location /app/ {
      proxy_pass http://vue_dev;
    }

    # API 与 HOJ 资源统一交 Vue dev server 的 vite proxy 分发
    # 避免在此重复维护后端微服务路由表（DRY：API 路由单点维护在 vite.config.js）
    location /api/ {
      proxy_pass http://vue_dev;
    }
    location /algo {
      proxy_pass http://vue_dev;
    }

    # 3D 首页（根路径默认，优先级最低，兜底所有静态资源与 HMR）
    location / {
      proxy_pass http://portfolio_dev;
    }
  }
}
