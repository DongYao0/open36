# ─────────────────────────────────────────────────────────────
#  public-web（Cloudflare Tunnel 入口）客户端 IP 处理：
#
#   1) 真实客户端 IP：
#        - 经 Cloudflare：$http_cf_connecting_ip（可信，CF 注入）
#        - 否则：$remote_addr（直连）
#   2) 原始 scheme：
#        - $X-Forwarded-Proto（Cloudflare 设置为 https）
#        - 否则：$scheme
#   3) Admin/前端代理对外网不暴露，仅 public-web 经 Cloudflare 接受不可信输入；
#      Cloudflare 在边缘已剥离任何客户端伪造的 CF-* 与 X-Forwarded-* 头，
#      边缘保留的是 Cloudflare 自身注入的真实客户端元数据。
#   4) Admin LAN 容器仅接受同 LAN 内部访问，对客户端 IP 的处理在 Admin nginx 单独配置。
# ─────────────────────────────────────────────────────────────

map $http_cf_connecting_ip $client_real_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

map $http_x_forwarded_proto $client_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s;

    client_max_body_size 512m;

    root /usr/share/nginx/html/landing;
    index index.html;

    # ════════════════════════════════════════════════════════════
    # 精确前缀 location 用 ^~ 强制优先级，置于静态扩展正则之前，
    # 确保 /app/ 与 /objects/ 不被吞掉
    # ════════════════════════════════════════════════════════════

    # ── Vue 业务应用 /app/ ──
    location ^~ /app/ {
        alias /usr/share/nginx/html/frontend/;
        try_files $uri $uri/ /app/index.html;
    }
    location = /app {
        return 302 /app/;
    }

    # ── 荣誉相册 ──
    location ^~ /honors/ {
        alias /usr/share/nginx/html/landing/honors/;
        try_files $uri =404;
    }

    # ── MinIO 对象公共读取 ──
    location ^~ /objects/ {
        set $minio_upstream minio;
        rewrite ^/objects/(.*)$ /$1 break;
        proxy_pass http://$minio_upstream:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Proto $client_proto;
    }

    # ── AI 流式对话：关闭缓冲 + 长读 + WebSocket ──
    location ^~ /api/ai/ {
        set $kong_upstream kong;
        proxy_pass http://$kong_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Proto $client_proto;
        # 浏览器与 public-web 同源；清除 Origin，避免 Quick Tunnel 随机域名
        # 被内部服务的静态 CORS 白名单拒绝。
        proxy_set_header Origin "";
        # 关键：关闭缓冲 + 强制不在 nginx 内缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no always;
    }

    # ── HOJ 前端（同源 /algo）──
    location ^~ /algo/ {
        set $hoj_vue hoj-vue;
        proxy_pass http://$hoj_vue:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Proto $client_proto;
    }

    # ── 其余 API → Kong ──
    location ^~ /api/ {
        set $kong_upstream kong;
        proxy_pass http://$kong_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Proto $client_proto;
        proxy_set_header Origin "";
    }

    # ── Landing SPA 回退 ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 静态资源缓存 ──
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
