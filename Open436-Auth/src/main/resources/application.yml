spring:
  application:
    name: Open436-Auth
  servlet:
    multipart:
      max-file-size: 11MB      # 文件上传大小限制（与 FileService 的 10MB 对齐，留余量）
      max-request-size: 11MB
  profiles:
    active: dev # 默认使用开发环境
  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        enabled: true
        service-name: auth-service
        instance-id: ${spring.application.name}:${random.value}
        health-check-path: /actuator/health
        health-check-interval: 10s
        prefer-ip-address: true
        hostname: ${HOSTNAME:localhost}

server:
  port: 8081

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized

# Sa-Token 配置（所有环境共用）
sa-token:
  token-name: token
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false
  auto-renew: true

# HOJ 同步配置
hoj:
  sync:
    url: ${HOJ_SYNC_URL:http://localhost:6688}
    api-key: ${HOJ_API_KEY:open436-secret-key}

# 文件服务配置
file:
  service:
    url: ${FILE_SERVICE_URL:http://localhost:8007}

# Kong 网关配置
kong:
  gateway:
    url: ${KONG_GATEWAY_URL:http://kong:8000}

# 安全配置
security:
  max-login-attempts: 5
  account-lock-duration: 3600

# 内部服务间调用密钥（生产环境必须通过环境变量覆盖）
internal:
  api-key: ${INTERNAL_API_KEY:open436-internal-dev-key-2026}

# CORS 配置（生产通过环境变量覆盖，如 Cloudflare Tunnel 域名与 Admin LAN 地址）
cors:
  # 注意：逗号分隔的字符串须整体加单引号包裹，否则 Spring 占位符内部的
  # 逗号会被 YAML 解析为列表项，导致解析失败。
  allowed-origins: '${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3005,http://localhost:5173,http://localhost:8080}'
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  # 包含业务实际请求头：Sa-Token 的 token、kong satoken-auth 注入的 X-User-*
  allowed-headers: 'Authorization,token,Content-Type,X-Requested-With,X-User-Id,X-Username,X-User-Role,X-User-Status,Accept,Origin,Referer,User-Agent'
  allow-credentials: true
  max-age: 3600
