spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false
    # 与 Auth 共用 open436 库：必须使用各自独立的 history table，避免版本号互相吞并
    table: enrollment_flyway_schema_history
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 3000ms

# 服务间调用（阶段5）
auth:
  service:
    url: ${AUTH_SERVICE_URL:http://auth:8081}
internal:
  api-key: ${INTERNAL_API_KEY:}

logging:
  level:
    com.open436.enrollment: WARN
