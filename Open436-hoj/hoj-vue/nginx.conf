server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 带内容指纹的构建资源必须真实存在。缺失资源返回 404，禁止回退到
    # index.html，否则浏览器会把 HTML 当作 JS 执行并在发版后白屏。
    location ^~ /algo/assets/ {
        alias /usr/share/nginx/html/assets/;
        try_files $uri @algo_asset_not_found;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location @algo_asset_not_found {
        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 404;
    }

    # 页面壳不缓存，确保每次刷新都拿到与当前哈希资源匹配的版本。
    location = /algo/index.html {
        alias /usr/share/nginx/html/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # HOJ publicPath = /algo/；只有前端路由允许回退到页面壳。
    location /algo/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /algo/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # API 代理 → HOJ Backend
    location /api/ {
        proxy_pass http://hoj-backend:6688;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 根路径重定向到 /algo/
    location = / {
        return 302 /algo/;
    }
}
