# ══════════════════════════════════════════════════════════
#  Open436 基础设施 Docker Compose（本地开发用）
#  仅包含基础设施，应用服务在 IDE 中运行
#  使用: docker compose up -d
#  含HOJ: docker compose --profile hoj up -d
#
#  全容器化部署请使用: docker-compose.full.yml
# ══════════════════════════════════════════════════════════

services:
  # ──────────── 基础设施 ────────────
  postgres:
    image: postgres:14-alpine
    container_name: open436-postgres
    environment:
      POSTGRES_USER: ${PG_USER:-open436}
      POSTGRES_PASSWORD: ${PG_PASS:-open436}
      POSTGRES_DB: ${PG_DB:-open436}
    ports: ["${PG_PORT:-55432}:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-open436}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [open436-net]

  redis:
    image: redis:7-alpine
    container_name: open436-redis
    ports: ["${REDIS_PORT:-6379}:6379"]
    networks: [open436-net]

  consul:
    image: hashicorp/consul:1.17
    container_name: open436-consul
    ports: ["${CONSUL_PORT:-8500}:8500"]
    command: agent -server -ui -bootstrap-expect=1 -client=0.0.0.0
    volumes: [consul-data:/consul/data]
    networks: [open436-net]

  minio:
    image: minio/minio:latest
    container_name: open436-minio
    ports: ["${MINIO_API:-9000}:9000", "${MINIO_CONSOLE:-9001}:9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS:-minioadmin}
    command: server /data --console-address ":9001"
    volumes: [minio-data:/data]
    networks: [open436-net]

  # ──────────── Milvus向量数据库 ────────────
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: open436-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes: [etcd-data:/etcd]
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks: [open436-net]

  milvus-standalone:
    image: milvusdb/milvus:v2.4.17
    container_name: open436-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes: [milvus-data:/var/lib/milvus]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9095/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports: ["19530:19530", "9091:9091"]
    depends_on:
      etcd: { condition: service_healthy }
      minio: { condition: service_started }
    networks: [open436-net]

  kong-db:
    image: postgres:14-alpine
    container_name: open436-kong-db
    environment: { POSTGRES_USER: kong, POSTGRES_PASSWORD: kong, POSTGRES_DB: kong }
    volumes: [kong-data:/var/lib/postgresql/data]
    networks: [open436-net]

  kong-migration:
    image: kong:3.4
    command: kong migrations bootstrap
    environment: &kong-db-env
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
    depends_on: [kong-db]
    networks: [open436-net]
    restart: on-failure

  kong:
    image: kong:3.4
    container_name: open436-kong
    environment:
      <<: *kong-db-env
      KONG_PLUGINS: bundled,satoken-auth
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports: ["${KONG_PROXY:-8000}:8000", "${KONG_ADMIN:-8001}:8001"]
    depends_on: [kong-migration, consul]
    networks: [open436-net]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./deploy/dev/kong/plugins/satoken-auth:/usr/local/share/lua/5.1/kong/plugins/satoken-auth

  # ──────────── 文件服务 ────────────
  file-service:
    build: ./Open436-FileService
    container_name: open436-file
    restart: unless-stopped
    ports: ["${FILE_PORT:-8007}:8007"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [open436-net]
    environment:
      DATABASE_URL: postgresql://${PG_USER:-open436}:${PG_PASS:-open436}@postgres:5432/${PG_DB:-open436}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8007"
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: open436-posts
      S3_ACCESS_KEY: ${MINIO_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_PASS:-minioadmin}
      S3_PUBLIC_URL: http://localhost:${MINIO_API:-9000}
      S3_PATH_STYLE: "true"
      CONSUL_URL: http://consul:8500

  # ──────────── HOJ 在线判题 (可选, --profile hoj) ────────────
  go-judge:
    image: go-judge-with-compilers:latest
    container_name: go-judge
    profiles: [hoj]
    restart: unless-stopped
    privileged: true
    ports: ["5050:5050"]
    volumes: [hoj-testcase:/judge/test_case]
    networks:
      open436-net:
        ipv4_address: 172.28.0.200

  hoj-mysql:
    image: mysql:8.0
    container_name: open436-hoj-mysql
    profiles: [hoj]
    environment:
      MYSQL_ROOT_PASSWORD: ${HOJ_MYSQL_PASS:-hoj123456}
      MYSQL_DATABASE: hoj
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports: ["${HOJ_MYSQL_PORT:-3307}:3306"]
    volumes: [hoj-mysql-data:/var/lib/mysql]
    networks: [open436-net]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${HOJ_MYSQL_PASS:-hoj123456}"]
      interval: 5s
      timeout: 5s
      retries: 10

  hoj-backend:
    build: { context: ./Open436-hoj/hoj-springboot, dockerfile: Dockerfile.backend }
    container_name: open436-hoj-backend
    profiles: [hoj]
    restart: unless-stopped
    ports: ["6688:6688"]
    depends_on: [hoj-mysql]
    networks: [open436-net]
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://hoj-mysql:3306/hoj?useSSL=false&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${HOJ_MYSQL_PASS:-hoj123456}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      MYSQL_HOST: hoj-mysql
      MYSQL_PORT: "3306"
      HOJ_OPEN436_API_KEY: ${HOJ_API_KEY:-open436-secret-key}
      JUDGE_TOKEN: default

  hoj-judge:
    build: { context: ./Open436-hoj/hoj-springboot, dockerfile: Dockerfile.judge }
    container_name: open436-hoj-judge
    profiles: [hoj]
    restart: unless-stopped
    ports: ["8088:8088"]
    depends_on:
      hoj-mysql: { condition: service_healthy }
      go-judge: { condition: service_started }
    networks: [open436-net]
    volumes:
      - ./hoj-judge-app.jar:/app/app.jar
      - hoj-testcase:/judge/test_case
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://hoj-mysql:3306/hoj?useSSL=false&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${HOJ_MYSQL_PASS:-hoj123456}
      HOJ_DB_USERNAME: root
      HOJ_DB_PASSWORD: ${HOJ_MYSQL_PASS:-hoj123456}
      HOJ_DB_PUBLIC_HOST: hoj-mysql
      HOJ_DB_PUBLIC_PORT: "3306"
      HOJ_DB_NAME: hoj
      MYSQL_HOST: hoj-mysql
      MYSQL_PORT: "3306"
      SANDBOX_URL: http://go-judge:5050
      JUDGE_SERVER_IP: open436-hoj-judge
      JUDGE_TOKEN: default
    entrypoint: ["/bin/sh", "-c", "GOJIP=$$(getent hosts go-judge | awk '{print $$1}') && if [ -n \"$$GOJIP\" ]; then echo \"$$GOJIP judgehost\" >> /etc/hosts; fi && exec java -jar app.jar"]

  hoj-vue:
    build: { context: ./Open436-hoj/hoj-vue, dockerfile: Dockerfile }
    container_name: open436-hoj-vue
    profiles: [hoj]
    restart: unless-stopped
    ports: ["8066:80"]
    depends_on: [hoj-backend]
    networks: [open436-net]

volumes:
  postgres-data:
  consul-data:
  minio-data:
  kong-data:
  hoj-mysql-data:
  hoj-testcase:
  etcd-data:
  milvus-data:

networks:
  open436-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
