# ─────────────────────────────────────────────────────────────
#  public-web server 配置（conf.d/default.conf）
#
#  缓存分层（阶段2）：
#    /assets/、/app/assets/  哈希资产   → 1 年 immutable
#    index.html、/app 壳               → no-cache
#    /honors/、/objects/、站内图片模型  → 7 天 + stale-while-revalidate
#    /api/*                            → no-store
#    /api/users/homepage/public        → 60s + SWR 300（公开内容）
#
#  注意 add_header 继承规则：location 内出现任一 add_header 即不再
#  继承上层，因此每个带缓存头的 location 都显式补 X-Request-ID。
# ─────────────────────────────────────────────────────────────

map $http_cf_connecting_ip $client_real_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

map $http_x_forwarded_proto $client_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# WebSocket 升级用 upgrade；普通请求留空 → 上游 keepalive 连接可复用
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# ── 上游连接复用（resolve 依赖 nginx≥1.27.3 与 http 级 resolver）──
upstream kong_backend {
    zone kong_backend 64k;
    server kong:8000 resolve;
    keepalive 96;
}
upstream minio_backend {
    zone minio_backend 32k;
    server minio:9000 resolve;
    keepalive 32;
}
upstream hojvue_backend {
    zone hojvue_backend 32k;
    server hoj-vue:80 resolve;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html/landing;
    index index.html;

    # ════════════════════════════════════════════════════════
    # 哈希静态资产：构建产物带内容指纹，可永久缓存
    # （longest-prefix 优先：^~ /app/assets/ 先于 ^~ /app/ 命中，
    #   不再被通用 /app/ 规则吞掉 —— 阶段2核心修复）
    # ════════════════════════════════════════════════════════
    location ^~ /app/assets/ {
        alias /usr/share/nginx/html/frontend/assets/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Request-ID $request_id always;
        access_log off;
    }
    location ^~ /assets/ {
        alias /usr/share/nginx/html/landing/assets/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Request-ID $request_id always;
        access_log off;
    }

    # ── Vue 业务应用壳（index.html 走 no-cache，避免发版后白屏）──
    location = /app/index.html {
        alias /usr/share/nginx/html/frontend/index.html;
        add_header Cache-Control "no-cache";
        add_header X-Request-ID $request_id always;
    }
    location ^~ /app/ {
        alias /usr/share/nginx/html/frontend/;
        try_files $uri $uri/ /app/index.html;
        add_header Cache-Control "no-cache";
        add_header X-Request-ID $request_id always;
    }
    location = /app {
        return 302 /app/;
    }

    # ── 荣誉相册：公开图片，7 天 + 过期后后台换新 ──
    location ^~ /honors/ {
        alias /usr/share/nginx/html/landing/honors/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        add_header X-Request-ID $request_id always;
        access_log off;
    }

    # ── MinIO 对象公共读取（帖子图片等）──
    location ^~ /objects/ {
        rewrite ^/objects/(.*)$ /$1 break;
        proxy_pass http://minio_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Proto $client_proto;
        proxy_set_header X-Request-ID $request_id;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        add_header X-Request-ID $request_id always;
        limit_req zone=api_per_ip burst=600 nodelay;
    }

    # ── 首页公共内容：唯一允许缓存的 API（阶段3 配合应用层 Redis）──
    location = /api/users/homepage/public {
        proxy_pass http://kong_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Proto $client_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header Cache-Control;   # 上游头与本层策略二选一，避免双头发给客户端
        add_header Cache-Control "public, max-age=60, stale-while-revalidate=300";
        add_header X-Request-ID $request_id always;
        limit_req zone=api_per_ip burst=600 nodelay;
    }

    # ── 文件上传接口：放宽到 12m ──
    location ^~ /api/files/ {
        client_max_body_size 12m;
        proxy_pass http://kong_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Proto $client_proto;
        proxy_set_header X-Request-ID $request_id;
        add_header Cache-Control "no-store";
        add_header X-Request-ID $request_id always;
        limit_req zone=api_per_ip burst=200 nodelay;
    }

    # ── HOJ 管理接口（用例 zip 上传）：仅管理员可达，放宽请求体 ──
    location ^~ /api/admin/ {
        client_max_body_size 512m;
        proxy_pass http://kong_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Proto $client_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_request_buffering off;   # 大包直通，避免双写磁盘
        add_header Cache-Control "no-store";
        add_header X-Request-ID $request_id always;
    }

    # ── AI 流式对话：关闭缓冲/压缩 + 长读 + WebSocket ──
    location ^~ /api/ai/ {
        proxy_pass http://kong_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Proto $client_proto;
        proxy_set_header X-Request-ID $request_id;
        # 浏览器与 public-web 同源；清除 Origin，避免随机域名被 CORS 白名单拒绝
        proxy_set_header Origin "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;   # SSE/流式响应禁止 gzip 缓冲
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no always;
        add_header Cache-Control "no-store";
        add_header X-Request-ID $request_id always;
        limit_req zone=api_per_ip burst=100 nodelay;
    }

    # ── 集中报名：独立 NAT 友好限流，业务层继续按幂等键防重复 ──
    location = /api/enrollment/apply {
        proxy_pass http://kong_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Proto $client_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Origin "";
        add_header Cache-Control "no-store";
        add_header X-Request-ID $request_id always;
        limit_req zone=enrollment_per_ip burst=1800 nodelay;
    }

    # ── HOJ 前端（同源 /algo，静态由 hoj-vue 自带 nginx 分发）──
    location ^~ /algo/ {
        proxy_pass http://hojvue_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Proto $client_proto;
        proxy_set_header X-Request-ID $request_id;
        add_header X-Request-ID $request_id always;
    }

    # ── 其余 API → Kong（默认 no-store）──
    location ^~ /api/ {
        proxy_pass http://kong_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Proto $client_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Origin "";
        add_header Cache-Control "no-store";
        add_header X-Request-ID $request_id always;
        limit_req zone=api_per_ip burst=600 nodelay;
    }

    # ── Landing 页面壳：no-cache（深链回退也走这里）──
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Request-ID $request_id always;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Request-ID $request_id always;
    }

    # ── Landing 站内图片/模型（3D 资源、logo 等）：7 天 + SWR ──
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|glb|gltf|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        add_header X-Request-ID $request_id always;
        access_log off;
    }
}
