# ─────────────────────────────────────────────────────────────
#  Admin nginx 客户端 IP 策略（关键安全边界）：
#
#   1) Admin 仅绑定 LAN 网卡 IP（compose 中 ADMIN_BIND_IP），仅同 LAN 内网访问。
#   2) 由于直连 LAN，**不应信任任何客户端伪造的 CF-Connecting-IP / X-Real-IP**：
#      - $http_cf_connecting_ip 是来自请求头，可被任意客户端设置。
#      - $http_x_real_ip 同理。
#      攻击者可注入 `X-Real-IP: 127.0.0.1` 绕过 IP-based 限流 / 审计。
#   3) 因此使用 $remote_addr（nginx 直连对端 IP）作为唯一真实 IP。
#   4) 原始 scheme：Admin 仅服务同 LAN HTTP；不存在 HTTPS 终止，
#      注入 $scheme=http 即可。
# ─────────────────────────────────────────────────────────────

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s;

    client_max_body_size 512m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ════════════════════════════════════════════════════════════
    # 精确前缀 location 用 ^~ 强制优先级
    # ════════════════════════════════════════════════════════════

    # ── AI 流式对话 ──
    location ^~ /api/ai/ {
        set $kong_upstream kong;
        proxy_pass http://$kong_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # 关键：使用 $remote_addr（直连对端），不信任客户端注入的 CF/X-Real-IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Admin API 与页面同源；内部服务无需执行跨域协商。
        proxy_set_header Origin "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no always;
    }

    location ^~ /api/hoj/ {
        set $kong_upstream kong;
        rewrite ^/api/hoj/(.*)$ /api/$1 break;
        proxy_pass http://$kong_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
    }

    location ^~ /api/ {
        set $kong_upstream kong;
        proxy_pass http://$kong_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
    }

    location ^~ /algo/ {
        set $hoj_vue hoj-vue;
        proxy_pass http://$hoj_vue:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /honors/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location ^~ /objects/ {
        set $minio_upstream minio;
        rewrite ^/objects/(.*)$ /$1 break;
        proxy_pass http://$minio_upstream:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
