spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # 阶段6：连接池统一预算（Auth=20，占 PG 总预算 150 的主体）
    # 获取连接最多等 3 秒快速失败，不无限堆积请求线程
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: 3000
      validation-timeout: 1000
      idle-timeout: 600000
      max-lifetime: 1800000

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false
    # 与 Enrollment 共用 open436 库：必须使用各自独立的 history table，避免版本号互相吞并
    table: auth_flyway_schema_history

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 3000ms

# 阶段6：HTTP 并行度起点（压测后再调；单实例优先，扩副本前先想连接池乘数）
server:
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:120}
      min-spare: 10
    accept-count: 100
    max-connections: 2000

logging:
  level:
    com.open436.auth: WARN
