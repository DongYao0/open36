# ─────────────────────────────────────────────────────────────
#  public-web 主配置（/etc/nginx/nginx.conf）
#  并发目标：1000 在线浏览 + 200 管理端查询 + HOJ 比赛。
#
#  关键点：
#   - worker 连接 8192 × auto worker（20 线程主机 ≈ 10 worker，
#     理论并发连接 8 万，实际受 keepalive 与上游限制）；
#   - gzip 压缩文本资源，静态资源由 conf.d 按"哈希资产 1 年不可变 /
#     页面壳 no-cache / 图片 7 天"分层下发缓存头；
#   - 日志带 $request_id 与上游耗时，便于全链路排查；
#   - limit_req 仅做每 IP 粗保护（校园 NAT 场景阈值放宽到 300r/s），
#     业务级限流在应用层按用户/幂等键实施。
# ─────────────────────────────────────────────────────────────

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 30;
    keepalive_requests 1000;

    client_header_timeout 10s;
    client_body_timeout   30s;
    send_timeout          30s;

    # 全局请求体上限：公开 API 只需小包；上传走 /api/files/（12m）
    # 与 /api/admin/（512m，HOJ 用例 zip）单独放宽的 location。
    client_max_body_size 2m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # Docker 内嵌 DNS：upstream server ... resolve 依赖此解析器
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 性能日志：请求ID + 客户端真实IP + 总耗时/上游耗时/上游地址
    log_format perf '$request_id $client_real_ip [$time_local] "$request" '
                    '$status $body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time ua=$upstream_addr';
    access_log /dev/stdout perf;

    # 每 IP 粗限流（NAT 感知：阈值必须容纳全校共用出口的场景）
    limit_req_zone $client_real_ip zone=api_per_ip:20m rate=300r/s;
    # 报名会出现短时间集中提交与同幂等键重试；单独放宽，避免校园 NAT
    # 下所有新生被视为同一 IP，同时仍保留入口层突发保护。
    limit_req_zone $client_real_ip zone=enrollment_per_ip:20m rate=600r/s;
    # 慢速攻击粗保护：请求体每秒 256KB 起，超过 60s 判超时
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
