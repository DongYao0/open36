# ══════════════════════════════════════════════════════════
#  Open436 前端聚合网关（本地开发）
#
#  前置条件：两个前端 dev server 已在宿主机运行
#    - Open436-Landing : npm run dev  ->  localhost:5173  (3D 首页)
#    - Open436-Frontend: npm run dev  ->  localhost:3000  (Vue 主应用)
#
#  启动:  docker compose -f deploy/dev/nginx/docker-compose.yml up -d
#  访问:  http://localhost:8080
#  停止:  docker compose -f deploy/dev/nginx/docker-compose.yml down
#  日志:  docker compose -f deploy/dev/nginx/docker-compose.yml logs -f
# ══════════════════════════════════════════════════════════

services:
  nginx-gateway:
    image: nginx:1.27-alpine
    container_name: open436-frontend-gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    # 让容器内可访问宿主机的 5173/3000 dev server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - gateway-net

networks:
  gateway-net:
    driver: bridge
