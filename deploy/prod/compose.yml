# ══════════════════════════════════════════════════════════
#  Open436 生产 Docker Compose
#  与开发环境隔离：
#    - 独立项目名：open436-prod（dev: open436-dev）
#    - 独立网络：open436-prod-internal（172.29.0.0/16）
#    - 独立卷：open436-prod-*（dev: open436-dev-*）
#    - 仅 ADMIN_BIND_IP:ADMIN_BIND_PORT 与 public-web 通过 cloudflared 暴露
#    - 其余服务全部仅暴露在 Docker 内部网络
#
#  启动顺序：
#    1. cp deploy/prod/.env.production.example deploy/prod/.env.production && 编辑
#    2. ./deploy/prod/scripts/precheck.sh
#    3. docker compose --env-file deploy/prod/.env.production -f deploy/prod/compose.yml config
#    4. docker compose --env-file deploy/prod/.env.production -f deploy/prod/compose.yml up -d --build
#
#  可选 profile：
#    --profile tunnel  启用 Cloudflare Quick Tunnel（生产可选访问入口）
#    --profile hoj     启用 HOJ 在线判题子系统
#    --profile crawler 启用 CrawlerService + SearXNG（AI 联网搜索）
# ══════════════════════════════════════════════════════════

name: "${COMPOSE_PROJECT_NAME:-open436-prod}"

services:
  # ──────────── 基础设施 ────────────
  postgres:
    init: true
    stop_grace_period: 30s
    pids_limit: 1024
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    mem_limit: 6g
    cpus: 4
    image: postgres:14-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-open436-prod}-postgres
    # 阶段9：48GB 共享主机（还跑 MySQL/Milvus/HOJ）下的保守预算。
    # max_connections=150 覆盖阶段6 预算(101)+Flyway/运维/峰值余量；
    # shared_buffers 2GB + effective_cache_size 6GB；work_mem 为每排序/哈希
    # 操作上限，勿盲目调大；SSD 环境 random_page_cost=1.1。
    command:
      - postgres
      - -c
      - max_connections=150
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_MULTIPLE_DATABASES: "ai_db"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db-init/00-run-all.sh:/docker-entrypoint-initdb.d/00-run-all.sh:ro
      - ../../Open436-AIService/migrations:/docker-entrypoint-initdb.d/ai:ro
      - ../../Open436-FileService/migrations:/docker-entrypoint-initdb.d/file_migrations:ro
      - ../../db-init:/docker-entrypoint-initdb.d/forum:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]
    restart: unless-stopped

  redis:
    init: true
    stop_grace_period: 30s
    pids_limit: 512
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    mem_limit: 2560m
    cpus: 1.5
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-open436-prod}-redis
    # 阶段9：AOF everysec + 2GB 上限 + noeviction。
    # noeviction 原因：Redis 存登录会话与 AI 流并发槽位，驱逐=用户掉线；
    # 所有缓存键必须带 TTL（应用层已保证），内存监控见 monitoring profile。
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 2gb
      - --maxmemory-policy
      - noeviction
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]
    restart: unless-stopped

  consul:
    init: true
    stop_grace_period: 30s
    pids_limit: 256
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    mem_limit: 512m
    cpus: 0.5
    image: hashicorp/consul:1.17
    container_name: ${COMPOSE_PROJECT_NAME:-open436-prod}-consul
    command: agent -server -ui -bootstrap-expect=1 -client=0.0.0.0
    volumes: [consul-data:/consul/data]
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [internal]
    restart: unless-stopped

  # ── Milvus 向量库 + etcd ──
  etcd:
    init: true
    stop_grace_period: 30s
    pids_limit: 512
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    mem_limit: 1g
    cpus: 1
    image: quay.io/coreos/etcd:v3.5.16
    container_name: ${COMPOSE_PROJECT_NAME:-open436-prod}-etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes: [etcd-data:/etcd]
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 5
    networks: [internal]
    restart: unless-stopped

  milvus:
    init: true
    stop_grace_period: 30s
    pids_limit: 1024
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    mem_limit: 4g
    cpus: 6
    image: milvusdb/milvus:v2.4.17
    container_name: ${COMPOSE_PROJECT_NAME:-open436-prod}-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: open436-milvus
      # v2.4.17 镜像自带的 LD_PRELOAD 首项错误地指向目录；只保留实际 jemalloc 库。
      LD_PRELOAD: /milvus/lib/libjemalloc.so
    volumes: [milvus-data:/var/lib/milvus]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 5
    depends_on:
      etcd: { condition: service_healthy }
      minio: { condition: service_healthy }
    networks: [internal]
    restart: unless-stopped

  # ── MinIO ──
  minio:
    init: true
    stop_grace_period: 30s
    pids_limit: 512
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    mem_limit: 2g
    cpus: 2
    image: minio/minio:RELEASE.2025-07-18T21-56-31Z
    container_name: ${COMPOSE_PROJECT_NAME:-open436-prod}-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks: [internal]
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: ${COMPOSE_PROJECT_NAME:-open436-prod}-minio-init
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        MINIO_ALIAS=local \
        MINIO_ENDPOINT=$${MINIO_ENDPOINT} \
        MINIO_ROOT_USER=$${MINIO_ROOT_USER} \
        MINIO_ROOT_PASSWORD=$${MINIO_ROOT_PASSWORD} \
        MINIO_BUCKET=$${MINIO_BUCKET} \
        sh /opt/init-minio.sh
    volumes:
      - ./minio/init-minio.sh:/opt/init-minio.sh:ro
    networks: [internal]
    restart: on-failure

  # ── Kong 网关（DB-less 模式 + satoken-auth 专用插件镜像）──
  #   路由表由 /opt/kong/kong.yml 声明式提供；无需传统 DB 与 migrations bootstrap。
  #   启动顺序由 depends_on 保证所有上游服务已就绪（否则 503 但无 500）。
  kong:
    init: true
    stop_grace_period: 30s
    pids_limit: 512
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    mem_limit: 1g
    cpus: 2
    build:
      context: ./kong
      dockerfile: Dockerfile
    image: open436/kong:3.4
    container_name: ${COMPOSE_PROJECT_NAME:-open436-prod}-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /opt/kong/kong.yml
      KONG_PLUGINS: bundled,satoken-auth
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    volumes:
      - ./kong/kong.yml:/opt/kong/kong.yml:ro
    depends_on:
      auth: { condition: service_started }
      file-service: { condition: service_started }
      enrollment: { condition: service_started }
      forum-service: { condition: service_started }
      ai-service: { condition: service_started }
    networks: [internal, edge]
    healthcheck:
      test: ["CMD-SHELL", "kong health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ──────────── Java 后端 ────────────
  auth:
    init: true
    stop_grace_period: 30s
    pids_limit: 512
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    mem_limit: 1536m
    cpus: 2
    build: { context: ../../Open436-Auth, dockerfile: Dockerfile }
    image: open436/auth:build
    container_name: ${COMPOSE_PROJECT_NAME:-open436-prod}-auth
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CONSUL_HOST: consul
      CONSUL_PORT: "8500"
      HOJ_SYNC_URL: http://hoj-backend:6688
      HOJ_API_KEY: ${HOJ_API_KEY}
      FILE_SERVICE_URL: http://file-service:8007
      KONG_GATEWAY_URL: http://kong:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      # 阶段6：连接池/线程预算可经 env 覆盖（默认 20/120）
      TOMCAT_MAX_THREADS: ${AUTH_TOMCAT_MAX_THREADS:-120}
      HIKARI_MAX_POOL: ${AUTH_HIKARI_MAX_POOL:-20}
      HIKARI_MIN_IDLE: ${AUTH_HIKARI_MIN_IDLE:-5}
      # 生产首启管理员初始化（ProductionAdminInitializer 读取并清理 V2/V10 默认账号）
      ADMIN_BOOTSTRAP_USER: ${ADMIN_BOOTSTRAP_USER:?ADMIN_BOOTSTRAP_USER 必须设置}
      ADMIN_BOOTSTRAP_PASSWORD_HASH: ${ADMIN_BOOTSTRAP_PASSWORD_HASH:?ADMIN_BOOTSTRAP_PASSWORD_HASH 必须设置（BCrypt cost=10）}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      consul: { condition: service_healthy }
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  enrollment:
    init: true
    stop_grace_period: 30s
    pids_limit: 512
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    mem_limit: 1g
    cpus: 1.5
    build: { context: ../../Open436-Enrollment, dockerfile: Dockerfile }
    image: open436/enrollment:build
    container_name: ${COMPOSE_PROJECT_NAME:-open436-prod}-enrollment
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CONSUL_HOST: consul
      CONSUL_PORT: "8500"
      AUTH_SERVICE_URL: http://auth:8081
      # 阶段5.3：报名对账需查询 Auth 幂等注册结果（内部接口密钥）
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      # 阶段6：连接池/线程预算可经 env 覆盖（默认 15/80）
      TOMCAT_MAX_THREADS: ${ENROLLMENT_TOMCAT_MAX_THREADS:-80}
      HIKARI_MAX_POOL: ${ENROLLMENT_HIKARI_MAX_POOL:-15}
      HIKARI_MIN_IDLE: ${ENROLLMENT_HIKARI_MIN_IDLE:-5}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      auth: { condition: service_healthy }
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/actuator/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  # ──────────── Python 后端 ────────────
  forum-service:
    init: true
    stop_grace_period: 30s
    pids_limit: 512
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    mem_limit: 1g
    cpus: 2
    build: { context: ../../Open436-Forum }
    image: open436/forum:build
    container_name: ${COMPOSE_PROJECT_NAME:-open436-prod}-forum
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      OPEN436_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SECRET_KEY: ${DJANGO_SECRET_KEY}
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
      CONSUL_URL: http://consul:8500
      AUTH_SERVICE_URL: http://auth:8081
      FILE_SERVICE_URL: http://file-service:8007
      FILE_SERVICE_NAME: file-service
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      SERVICE_PORT: "8003"
      CONSUL_SERVICE_NAME: forum-service
      # 阶段4.1：共享缓存走 Redis（db3；不设则回退 LocMemCache）
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/3
      # 阶段7：gthread 4×4（16 并发，对齐 PG 连接预算）
      FORUM_WORKERS: ${FORUM_WORKERS:-4}
      FORUM_THREADS: ${FORUM_THREADS:-4}
      FORUM_TIMEOUT: ${FORUM_TIMEOUT:-30}
    depends_on:
      postgres: { condition: service_healthy }
      auth: { condition: service_healthy }
    networks: [internal]
    healthcheck:
      # Django 实际暴露 /health/（apps/core/urls.py:8）；Open436-Forum 自定义镜像
      # 已 apt-get install curl（Dockerfile line 8）
      test: ["CMD-SHELL", "curl -fsS http://localhost:8003/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 60s
    restart: unless-stopped

  file-service:
    init: true
    stop_grace_period: 30s
    pids_limit: 512
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    mem_limit: 1g
    cpus: 1.5
    build: { context: ../../Open436-FileService }
    image: open436/file-service:build
    container_name: ${COMPOSE_PROJECT_NAME:-open436-prod}-file
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8007"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${MINIO_BUCKET}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      # 同源相对路径：前端 / Admin / public-web 通过 /objects/<bucket>/<key> 访问
      # 由 public-web 与 Admin nginx 反代到 minio:9000（path_style=true）
      S3_PUBLIC_URL: /objects/${MINIO_BUCKET}
      S3_PATH_STYLE: "true"
      KONG_GATEWAY_URL: http://kong:8000
      CONSUL_URL: http://consul:8500
      AUTH_SERVICE_URL: http://auth:8081
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      # 阶段7：显式 4 worker 起点；DB 池 20/5 纳入 PG 总预算（均可 env 覆盖）
      FILE_WORKERS: ${FILE_WORKERS:-4}
      FILE_DB_MAX_CONNECTIONS: ${FILE_DB_MAX_CONNECTIONS:-20}
      FILE_DB_MIN_CONNECTIONS: ${FILE_DB_MIN_CONNECTIONS:-5}
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8007/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  ai-service:
    init: true
    stop_grace_period: 30s
    pids_limit: 512
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    mem_limit: 2560m
    cpus: 4
    build: { context: ../../Open436-AIService }
    image: open436/ai-service:build
    container_name: ${COMPOSE_PROJECT_NAME:-open436-prod}-ai
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/ai_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      # 全部使用 Compose service name，不依赖宿主机回环地址。
      CONTENT_SERVICE_URL: http://forum-service:8003
      SECTION_SERVICE_URL: http://forum-service:8003
      USER_SERVICE_URL: http://auth:8081
      AUTH_SERVICE_URL: http://auth:8081
      HOJ_API_URL: http://hoj-backend:6688
      CRAWLER_SERVICE_URL: http://crawler:8500
      SEARXNG_URL: http://searxng:8080
      HOJ_ADMIN_USER: ${HOJ_ADMIN_USER}
      HOJ_ADMIN_PASS: ${HOJ_ADMIN_PASS}
      # AI 调 Forum /internal/* 时必须与 Forum 使用同一密钥。
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      CONSUL_URL: http://consul:8500
      CONSUL_SERVICE_NAME: ai-service
      SERVICE_PORT: "8008"
      APP_DEBUG: "false"
      APP_LOG_LEVEL: info
      AI_STREAM_TIMEOUT_SECONDS: "300"
      # 阶段7：uvicorn worker 数与全局流并发（Redis 共享信号量）
      AI_WORKERS: ${AI_WORKERS:-2}
      AI_STREAM_MAX_CONCURRENT: ${AI_STREAM_MAX_CONCURRENT:-20}
      AI_STREAM_QUEUE_SIZE: ${AI_STREAM_QUEUE_SIZE:-50}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      milvus: { condition: service_healthy }
      consul: { condition: service_healthy }
      auth: { condition: service_healthy }
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8008/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 60s
    restart: unless-stopped

  # ──────────── HOJ（可选, --profile hoj）────────────
  go-judge:
    init: true
    stop_grace_period: 30s
    pids_limit: 2048
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    mem_limit: 3g
    cpus: 8
    build: { context: ./go-judge }
    image: open436/go-judge:v1.12.0
    container_name: ${COMPOSE_PROJECT_NAME:-open436-prod}-go-judge
    profiles: [hoj]
    privileged: true
    # criyle/go-judge v1.12.0 默认仅监听 localhost:5050，hoj-judge 容器
    # 通过服务名访问会被拒绝连接（Connection refused）。必须显式绑定 0.0.0.0。
    command: ["-http-addr=0.0.0.0:5050"]
    volumes: [hoj-testcase:/judge/test_case]
    networks:
      internal:
        ipv4_address: 172.29.0.200
    # go-judge HTTP /version 端点（无需 token）：可用作健康检查
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5050/version >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  hoj-mysql:
    init: true
    stop_grace_period: 30s
    pids_limit: 1024
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    mem_limit: 5g
    cpus: 4
    image: mysql:8.4
    container_name: ${COMPOSE_PROJECT_NAME:-open436-prod}-hoj-mysql
    profiles: [hoj]
    environment:
      MYSQL_ROOT_PASSWORD: ${HOJ_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: hoj
    # HOJ 遗留 schema 含外键指向非唯一索引；MySQL 8.4 默认禁止，需显式兼容。
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --restrict-fk-on-non-standard-key=OFF
      # 阶段9：连接预算 120（Backend 60 + Judge 20 + 管理/备份保留 40）
      - --max_connections=120
      # HOJ 数据集常驻内存（48GB 主机的 4GB 切片）
      - --innodb_buffer_pool_size=4G
      # 慢查询观测：>0.5s 落 slow log（轮转见 deploy/prod/README）
      - --slow_query_log=ON
      - --long_query_time=0.5
    volumes:
      - hoj-mysql-data:/var/lib/mysql
      # 仅在数据卷首次初始化时执行；HOJ 原始 schema/seed 后接生产加固脚本。
      - ../../Open436-hoj/sqlAndsetting/hoj.sql:/docker-entrypoint-initdb.d/10-hoj.sql:ro
      - ./hoj/20-production-hardening.sql:/docker-entrypoint-initdb.d/20-production-hardening.sql:ro
    healthcheck:
      # mysqladmin ping 在首次导入尚未结束时也会成功；查询业务表才能证明冷启动初始化完成。
      test: ["CMD-SHELL", "mysql -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" -Nse 'SELECT COUNT(*) FROM hoj.role' | grep -Eq '^[1-9][0-9]*$'"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]
    restart: unless-stopped

  # ── Nacos（HOJ 服务注册中心，已在配置中硬编码依赖）──
  hoj-nacos:
    init: true
    stop_grace_period: 30s
    pids_limit: 512
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    mem_limit: 1g
    cpus: 1
    image: nacos/nacos-server:v2.3.2
    container_name: ${COMPOSE_PROJECT_NAME:-open436-prod}-hoj-nacos
    profiles: [hoj]
    environment:
      MODE: standalone
      JVM_XMS: 512m
      JVM_XMX: 512m
    volumes: [nacos-data:/home/nacos/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8848/nacos/actuator/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks: [internal]
    restart: unless-stopped

  hoj-backend:
    init: true
    stop_grace_period: 30s
    pids_limit: 512
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    mem_limit: 2g
    cpus: 2
    build: { context: ../../Open436-hoj/hoj-springboot, dockerfile: Dockerfile.backend }
    image: open436/hoj-backend:build
    container_name: ${COMPOSE_PROJECT_NAME:-open436-prod}-hoj-backend
    profiles: [hoj]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      NACOS_URL: hoj-nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MYSQL_HOST: hoj-mysql
      MYSQL_PORT: "3306"
      MYSQL_PUBLIC_HOST: hoj-mysql
      MYSQL_PUBLIC_PORT: "3306"
      MYSQL_USERNAME: root
      MYSQL_DATABASE_NAME: hoj
      # 阶段8.4：Backend Druid 池预算（默认 60，对齐 MySQL max_connections=120）
      HOJ_DB_POOL_MAX_ACTIVE: ${HOJ_BACKEND_DB_POOL_MAX_ACTIVE:-60}
      HOJ_DB_POOL_MIN_IDLE: ${HOJ_BACKEND_DB_POOL_MIN_IDLE:-10}
      HOJ_DB_POOL_MAX_WAIT: ${HOJ_BACKEND_DB_POOL_MAX_WAIT:-3000}
      MYSQL_ROOT_PASSWORD: ${HOJ_MYSQL_ROOT_PASSWORD}
      JWT_TOKEN_SECRET: ${HOJ_JWT_SECRET:?HOJ_JWT_SECRET 必须设置}
      # JUDGE_TOKEN 必填：来自 .env，仓库不留默认（防止"default"被外部穷举）
      JUDGE_TOKEN: ${JUDGE_TOKEN:?JUDGE_TOKEN 必须设置（见 deploy/prod/.env.production.example）}
      HOJ_OPEN436_API_KEY: ${HOJ_API_KEY}
      HOJ_ADMIN_USER: ${HOJ_ADMIN_USER}
      HOJ_ADMIN_PASS: ${HOJ_ADMIN_PASS}
      OPEN_REMOTE_JUDGE: "false"
    depends_on:
      hoj-mysql: { condition: service_healthy }
      hoj-nacos: { condition: service_healthy }
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:6688/actuator/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    restart: unless-stopped

  hoj-judge:
    init: true
    stop_grace_period: 30s
    pids_limit: 512
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    mem_limit: 2g
    cpus: 4
    build: { context: ../../Open436-hoj/hoj-springboot, dockerfile: Dockerfile.judge }
    image: open436/hoj-judge:build
    container_name: ${COMPOSE_PROJECT_NAME:-open436-prod}-hoj-judge
    profiles: [hoj]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      NACOS_URL: hoj-nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      hoj.db.username: root
      hoj.db.password: ${HOJ_MYSQL_ROOT_PASSWORD}
      hoj.db.host: hoj-mysql
      hoj.db.port: "3306"
      hoj.db.public-host: hoj-mysql
      hoj.db.public-port: "3306"
      hoj.db.name: hoj
      # Spring 对含点号的原始环境变量不会做可靠的 relaxed binding；直接覆盖标准数据源键。
      SPRING_DATASOURCE_URL: jdbc:mysql://hoj-mysql:3306/hoj?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true&rewriteBatchedStatements=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${HOJ_MYSQL_ROOT_PASSWORD}
      MYSQL_HOST: hoj-mysql
      MYSQL_PORT: "3306"
      MYSQL_PUBLIC_HOST: hoj-mysql
      MYSQL_PUBLIC_PORT: "3306"
      MYSQL_USERNAME: root
      MYSQL_DATABASE_NAME: hoj
      MYSQL_ROOT_PASSWORD: ${HOJ_MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # 关键修复：SANDBOX_URL 由源码读取，无需任何 jar 补丁
      SANDBOX_URL: http://go-judge:5050
      # Docker DNS 服务名，不依赖 COMPOSE_PROJECT_NAME 或 container_name。
      JUDGE_SERVER_IP: hoj-judge
      JUDGE_SERVER_NAME: hoj-judger-1
      # JUDGE_TOKEN 必填：与 hoj-backend 共享同一密钥（验证 Auth↔HOJ 同步）
      JUDGE_TOKEN: ${JUDGE_TOKEN:?JUDGE_TOKEN 必须设置（见 deploy/prod/.env.production.example）}
      # judge jar(20241013) 无 application-prod.yml，hoj.judge.token 会落到默认值
      # no_judge_token 导致 backend 调用 /judge 全部 401。用 relaxed binding 显式注入。
      HOJ_JUDGE_TOKEN: ${JUDGE_TOKEN}
      # 阶段8.1：限制真实判题并行度（原 -1=CPU自动扩到20+，
      # 编译互抢 CPU 拖垮 Web；6 为 10核20线程主机压测起点）
      MAX_TASK_NUM: ${JUDGE_MAX_TASK_NUM:-6}
      REMOTE_JUDGE_OPEN: "false"
      REMOTE_JUDGE_MAX_TASK_NUM: "-1"
      # 阶段8.2/8.4：判题线程池与 Druid 池预算（env 可覆盖）
      JUDGE_WORKERS: ${JUDGE_WORKERS:-6}
      JUDGE_QUEUE_CAPACITY: ${JUDGE_QUEUE_CAPACITY:-300}
      HOJ_DB_POOL_MAX_ACTIVE: ${HOJ_JUDGE_DB_POOL_MAX_ACTIVE:-20}
      HOJ_DB_POOL_MIN_IDLE: ${HOJ_JUDGE_DB_POOL_MIN_IDLE:-5}
      HOJ_DB_POOL_MAX_WAIT: ${HOJ_JUDGE_DB_POOL_MAX_WAIT:-3000}
    entrypoint: ["/bin/sh", "-c", "exec java -jar app.jar"]
    depends_on:
      hoj-mysql: { condition: service_healthy }
      hoj-nacos: { condition: service_healthy }
      go-judge: { condition: service_started }
    volumes:
      - hoj-testcase:/judge/test_case
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8088/actuator/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    restart: unless-stopped

  hoj-vue:
    init: true
    stop_grace_period: 30s
    pids_limit: 256
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    mem_limit: 256m
    cpus: 0.5
    build: { context: ../../Open436-hoj/hoj-vue }
    image: open436/hoj-vue:build
    container_name: ${COMPOSE_PROJECT_NAME:-open436-prod}-hoj-vue
    profiles: [hoj]
    depends_on:
      hoj-backend: { condition: service_healthy }
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/algo/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ──────────── Crawler + SearXNG（可选, --profile crawler）────────────
  searxng:
    init: true
    stop_grace_period: 30s
    pids_limit: 512
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    mem_limit: 1g
    cpus: 1
    image: searxng/searxng:2026.9.8-3fdc6d753
    container_name: ${COMPOSE_PROJECT_NAME:-open436-prod}-searxng
    profiles: [crawler]
    environment:
      SEARXNG_SECRET: ${DJANGO_SECRET_KEY}
      SEARXNG_BASE_URL: http://searxng:8080
    volumes:
      - ../../searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ../../searxng/limiter.toml:/etc/searxng/limiter.toml:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --proxy=off http://localhost:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  crawler:
    init: true
    stop_grace_period: 30s
    pids_limit: 512
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    mem_limit: 1g
    cpus: 1
    build: { context: ../../Open436-CrawlerService }
    image: open436/crawler:build
    container_name: ${COMPOSE_PROJECT_NAME:-open436-prod}-crawler
    profiles: [crawler]
    depends_on:
      searxng: { condition: service_healthy }
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8500/health', timeout=5)\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ──────────── 公开入口 ────────────
  public-web:
    init: true
    stop_grace_period: 30s
    pids_limit: 256
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    mem_limit: 512m
    cpus: 2
    build:
      context: ../..
      dockerfile: deploy/prod/public-web/Dockerfile
    image: open436/public-web:build
    container_name: ${COMPOSE_PROJECT_NAME:-open436-prod}-public-web
    # 前端产物走宿主机 bind mount：服务器镜像源不可用无法重建镜像时，
    # 仍可在宿主构建 dist 后直接替换 deploy/prod/public-web/dist/*。
    volumes:
      - ./public-web/dist/landing:/usr/share/nginx/html/landing:ro
      - ./public-web/dist/frontend:/usr/share/nginx/html/frontend:ro
    depends_on:
      kong: { condition: service_healthy }
      forum-service: { condition: service_healthy }
      file-service: { condition: service_healthy }
      minio: { condition: service_healthy }
    networks: [internal, edge]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  admin:
    init: true
    stop_grace_period: 30s
    pids_limit: 256
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    mem_limit: 256m
    cpus: 0.5
    build:
      context: ../../Open436-Admin
      dockerfile: Dockerfile.prod
      additional_contexts:
        landing: ../../Open436-Landing
    image: open436/admin:build
    container_name: ${COMPOSE_PROJECT_NAME:-open436-prod}-admin
    ports:
      # 仅 Admin 容器发布到宿主机的 LAN 网卡 IP；其他服务一律不暴露
      - target: 80
        published: ${ADMIN_BIND_PORT:-3001}
        protocol: tcp
        host_ip: ${ADMIN_BIND_IP}
    volumes:
      # cloudflared 原子更新当前公网地址；Admin 只读展示，不持有隧道凭据。
      - tunnel-runtime:/usr/share/nginx/html/runtime:ro
    depends_on:
      auth: { condition: service_healthy }
      enrollment: { condition: service_healthy }
      file-service: { condition: service_healthy }
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ──────────── Cloudflare Quick Tunnel（可选, --profile tunnel）────────────
  cloudflared:
    init: true
    stop_grace_period: 30s
    pids_limit: 256
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    mem_limit: 256m
    cpus: 0.5
    build: { context: ./cloudflared }
    image: open436/cloudflared-url-publisher:2024.12.2
    container_name: ${COMPOSE_PROJECT_NAME:-open436-prod}-cloudflared
    profiles: [tunnel]
    # 包装镜像保留固定 cloudflared 版本，并把当前客户端 URL 原子发布到共享卷。
    # Quick Tunnel 自动从日志捕获随机 URL；Named Tunnel 使用 PUBLIC_CLIENT_URL。
    # --protocol http2：QUIC(UDP) 在校园网环境反复超时导致 quick tunnel 被
    # Cloudflare 注销（NXDOMAIN）。http2 走 TCP 更稳。
    environment:
      CLOUDFLARE_TUNNEL_ARGS: ${CLOUDFLARE_TUNNEL_ARGS:-}
      PUBLIC_CLIENT_URL: ${PUBLIC_CLIENT_URL:-}
    volumes:
      - tunnel-runtime:/runtime
    networks: [edge]
    restart: unless-stopped

  # ──────────── 监控栈（可选, --profile monitoring，仅实验室 LAN）────────────
  # 端口绑定 ADMIN_BIND_IP（与 Admin 同网段），不经 Cloudflare 暴露公网。
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ${COMPOSE_PROJECT_NAME:-open436-prod}-prometheus
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${ADMIN_BIND_IP:-172.20.193.162}:9090:9090"
    init: true
    stop_grace_period: 30s
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    mem_limit: 1g
    cpus: "1"
    networks: [internal]

  grafana:
    image: grafana/grafana:10.4.5
    container_name: ${COMPOSE_PROJECT_NAME:-open436-prod}-grafana
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "${ADMIN_BIND_IP:-172.20.193.162}:3002:3000"
    depends_on:
      prometheus: { condition: service_started }
    init: true
    stop_grace_period: 30s
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    mem_limit: 512m
    cpus: "1"
    networks: [internal]

  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: ${COMPOSE_PROJECT_NAME:-open436-prod}-node-exporter
    profiles: [monitoring]
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    pid: host
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 256m
    cpus: "0.5"
    networks: [internal]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: ${COMPOSE_PROJECT_NAME:-open436-prod}-cadvisor
    profiles: [monitoring]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 512m
    cpus: "1"
    networks: [internal]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: ${COMPOSE_PROJECT_NAME:-open436-prod}-postgres-exporter
    profiles: [monitoring]
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 256m
    cpus: "0.5"
    networks: [internal]

  mysqld-exporter:
    image: prometheuscommunity/mysqld-exporter:v0.15.1
    container_name: ${COMPOSE_PROJECT_NAME:-open436-prod}-mysqld-exporter
    profiles: [monitoring]
    command:
      - --mysqld.username=root
      - --mysqld.address=hoj-mysql:3306
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${HOJ_MYSQL_ROOT_PASSWORD}
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 256m
    cpus: "0.5"
    networks: [internal]

  redis-exporter:
    image: oliver006/redis_exporter:v1.61.0
    container_name: ${COMPOSE_PROJECT_NAME:-open436-prod}-redis-exporter
    profiles: [monitoring]
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 256m
    cpus: "0.5"
    networks: [internal]

  # HOJ /version 的 JSON 指标转 Prometheus（判题池 queued/rejected）
  json-exporter:
    image: prometheuscommunity/json-exporter:v0.6.0
    container_name: ${COMPOSE_PROJECT_NAME:-open436-prod}-json-exporter
    profiles: [monitoring]
    volumes:
      - ./monitoring/json-exporter-config.yml:/config.yml:ro
    command:
      - --config.file=/config.yml
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 128m
    cpus: "0.5"
    networks: [internal]

volumes:
  tunnel-runtime:
  postgres-data:
  redis-data:
  consul-data:
  minio-data:
  etcd-data:
  milvus-data:
  hoj-mysql-data:
  hoj-testcase:
