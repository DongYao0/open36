---
language: Java
src_path: Main.java
exe_path: Main.jar
compile:
  env: default
  command: /bin/bash -c "javac -encoding utf-8 {src_path} && jar -cvf {exe_path} *.class"
  maxCpuTime: 10s
  maxRealTime: 20s
  maxMemory: 512mb
run:
  env: default
  command: /usr/bin/java -Dfile.encoding=UTF-8 -cp /w/{exe_path} Main

---
# Python3：open436/go-judge 镜像基于 Debian trixie，只提供 /usr/bin/python3 (3.13)
# 编译目标 __pycache__/main.cpython-313.pyc
language: Python3
src_path: main.py
exe_path: __pycache__/main.cpython-313.pyc
compile:
  env: python3
  command: /usr/bin/python3 -m py_compile /w/{src_path}
  maxCpuTime: 5s
  maxRealTime: 10s
  maxMemory: 256mb
run:
  env: python3
  command: /usr/bin/python3 /w/{src_path}

---
language: Golang
src_path: main.go
exe_path: main
compile:
  env: golang_compile
  command: /usr/bin/go build -o {exe_path} {src_path}
  maxCpuTime: 5s
  maxRealTime: 10s
  maxMemory: 512mb
run:
  env: golang_run
  command: /w/{exe_path}

