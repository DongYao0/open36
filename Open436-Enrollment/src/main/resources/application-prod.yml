spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # 阶段6：报名为写少读少服务，池上限 15（PG 总预算 150 内）
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:15}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: 3000
      validation-timeout: 1000
      idle-timeout: 600000
      max-lifetime: 1800000
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false
    # 与 Auth 共用 open436 库：必须使用各自独立的 history table，避免版本号互相吞并
    table: enrollment_flyway_schema_history
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 3000ms

# 阶段6：HTTP 并行度起点（报名突发由幂等键排队，而非线程堆叠）
server:
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:80}
      min-spare: 10
    accept-count: 100
    max-connections: 2000

# 服务间调用（阶段5）
auth:
  service:
    url: ${AUTH_SERVICE_URL:http://auth:8081}
internal:
  api-key: ${INTERNAL_API_KEY:}

logging:
  level:
    com.open436.enrollment: WARN
